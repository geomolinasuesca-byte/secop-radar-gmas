name: SECOP Radar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vigilar-secop:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar SECOP Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node secop-radar.js

      - name: Guardar el estado (evita alertas repetidas)
        run: |
          git config user.name "secop-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json alertas_log.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Actualiza estado de SECOP Radar [skip ci]"
          git push || true
