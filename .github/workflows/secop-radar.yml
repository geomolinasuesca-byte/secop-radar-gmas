name: SECOP Radar

on:
  schedule:
    # Corre una vez al día, 8:00 a.m. hora Colombia (13:00 UTC, Colombia no cambia de horario).
    - cron: "0 13 * * *"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write # necesario para poder guardar el estado (seen.json) de vuelta en el repo

jobs:
  vigilar-secop:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar SECOP Radar
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node secop-radar.js

      - name: Guardar el estado (evita alertas repetidas)
        run: |
          git config user.name "secop-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clientes/*/seen.json alertas_log.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Actualiza estado de SECOP Radar [skip ci]"
          git push || true
